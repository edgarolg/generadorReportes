<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0e0e16">
  <title>FotoReporte</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
</head>
<body>

  <!-- ══ NAV ══ -->
  <nav class="nav">
    <div class="logo">Foto<em>Reporte</em></div>
    <div class="nav-count" id="totalCount">0 fotos</div>
  </nav>

  <!-- ══ TABS ══ -->
  <div class="tabs">
    <button class="tab on" onclick="App.showTab('cam')">📷 Capturar</button>
    <button class="tab"    onclick="App.showTab('gal')">🖼 Galería</button>
    <button class="tab"    onclick="App.showTab('exp')">📊 Exportar</button>
  </div>

  <!-- ══ CAPTURE ══ -->
  <section id="scrCam" class="scr on">
    <div class="cam-box">
      <video id="video" autoplay playsinline muted></video>
      <div class="cam-corner tl"></div>
      <div class="cam-corner br"></div>
      <div class="cam-off" id="camOff">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <span>Activar cámara</span>
      </div>
    </div>
    <canvas id="snap"></canvas>

    <div class="cam-ctrl">
      <div class="left">
        <div>
          <label class="lbl">Proyecto / Sesión</label>
          <div class="proj-row">
            <select class="sel" id="projSelect" style="flex:1"></select>
            <button class="btn-new" onclick="Projects.openNew()">+ Nuevo</button>
          </div>
        </div>
        <div>
          <label class="lbl">Ubicación</label>
          <div style="display:flex;gap:8px">
            <input class="inp" id="locInput" placeholder="Ej: Bodega Norte, Rack A3" style="flex:1">
            <button class="btn-gps" onclick="Camera.getGPS()">📍</button>
          </div>
        </div>
        <div>
          <label class="lbl">Descripción (opcional)</label>
          <textarea class="ta" id="descInput" placeholder="¿Qué muestra esta foto?"></textarea>
        </div>
      </div>
      <button class="shoot-btn" id="shootBtn" onclick="Camera.takePhoto()">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <circle cx="12" cy="12" r="8"/>
          <circle cx="12" cy="12" r="3" fill="white"/>
        </svg>
      </button>
    </div>

    <div id="recentStrip" class="recent-strip" style="display:none">
      <label class="lbl" style="margin-bottom:8px;display:block">Últimas fotos</label>
      <div id="recentPhotos" class="recent-photos"></div>
    </div>
  </section>

  <!-- ══ GALLERY ══ -->
  <section id="scrGal" class="scr">
    <div id="selToolbar" class="sel-toolbar" style="display:none">
      <span id="selCount">0 seleccionadas</span>
      <button onclick="Gallery.cancelSelect()">Cancelar</button>
    </div>
    <div class="gal-head">
      <h2>Mis Fotos</h2>
      <span class="gal-hint" id="galHint"></span>
    </div>
    <div id="galContent"></div>
    <div class="bottom-bar" id="galBar" style="display:none">
      <button class="bar-btn danger"  onclick="Gallery.deleteSelected()">Eliminar</button>
      <button class="bar-btn primary" onclick="Gallery.exportSelected()">Exportar selección</button>
    </div>
  </section>

  <!-- ══ EXPORT ══ -->
  <section id="scrExp" class="scr">
    <div class="exp-head">
      <h2>Exportar a PowerPoint</h2>
      <p>Elige un proyecto para generar el archivo .pptx</p>
    </div>
    <div id="expContent" class="exp-proj-list"></div>
  </section>

  <!-- ══ MODAL: NUEVO PROYECTO ══ -->
  <div class="modal-bg" id="modalProj">
    <div class="modal">
      <h3>Nuevo proyecto</h3>
      <p>Dale un nombre a esta sesión o lugar de trabajo</p>
      <div class="field">
        <label class="lbl">Nombre del proyecto</label>
        <input class="inp" id="newProjName"
          placeholder="Ej: Inspección Planta 2 — 15 Mar"
          onkeydown="if(event.key==='Enter') Projects.saveNew()">
      </div>
      <div class="row">
        <button class="cancel" onclick="UI.closeModal('modalProj')">Cancelar</button>
        <button class="ok"     onclick="Projects.saveNew()">Crear</button>
      </div>
    </div>
  </div>

  <!-- ══ PHOTO DETAIL ══ -->
  <div class="detail-bg" id="detailView">
    <div class="detail-head">
      <button onclick="Gallery.closeDetail()">← Volver</button>
      <button class="detail-del" onclick="Gallery.deleteDetailPhoto()">Eliminar</button>
    </div>
    <img class="detail-img" id="detailImg" src="" alt="">
    <div class="detail-info">
      <div class="detail-loc"  id="detailLoc"></div>
      <div class="detail-desc" id="detailDesc"></div>
      <div class="detail-time" id="detailTime"></div>
    </div>
  </div>

  <!-- ══ PROGRESS ══ -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-title">Generando PowerPoint…</div>
    <div class="progress-bar-bg">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-label" id="progressLabel">Preparando…</div>
  </div>

  <!-- ══ TOAST ══ -->
  <div class="toast" id="toast"></div>

  <!-- ══ SCRIPTS (orden importa: storage → ui → camera → projects → gallery → export → app) ══ -->
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
